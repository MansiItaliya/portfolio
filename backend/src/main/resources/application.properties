spring.application.name=portfolio
server.port=${PORTFOLIO_SERVER_PORT:8080}

# Global API Context Path (Optional, but default controller maps /api)
# Logging Configuration
logging.level.root=INFO
logging.level.com.portfolio=DEBUG

# Portfolio Owner Configuration
portfolio.owner.email=${PORTFOLIO_OWNER_EMAIL:owner@example.com}

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health,info
